<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title id="page-title">Convite Real Encantado</title>

<!-- 🌟 META TAGS PARA WHATSAPP 🌟 -->
<meta property="og:type" content="website" />
<meta id="og-title" property="og:title" content="Convite Real de Aniversário 👑✨" />
<meta id="og-desc" property="og:description" content="Você é nosso convidado de honra! Toque para abrir o convite mágico." />
<meta property="og:image" content="https://festadamaite.phsublime.com.br/compartilhar.jpeg" />
<meta property="og:image:type" content="image/jpeg" />

<!-- Fontes Nobres -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Great+Vibes&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #0d0608;
  overflow: hidden;
  font-family: system-ui, -apple-system, sans-serif;
  display: flex; align-items: center; justify-content: center;
}
.stage {
  position: relative;
  width: 100%; height: 100%;
  max-width: 480px; max-height: 100vh;
  aspect-ratio: 9 / 16;
  background: #000;
  overflow: hidden;
  box-shadow: 0 0 35px rgba(0,0,0,0.85);
  touch-action: none;
}
.stage img, .stage video {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  user-select: none;
  -webkit-user-drag: none;
}

#cover { z-index: 50; cursor: pointer; transition: opacity 0.5s ease; }
.opened #cover { opacity: 0; pointer-events: none; }

.video-player {
  z-index: 40;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.7s ease-in-out;
}
.video-player.visivel { opacity: 1; pointer-events: auto; }

#btn-pular {
  position: absolute; right: 14px; bottom: 24px;
  z-index: 80; display: none;
  background: rgba(0, 0, 0, 0.75);
  color: #fff;
  border: 1px solid rgba(212, 175, 55, 0.8);
  border-radius: 20px;
  padding: 8px 16px; font-size: 13px; font-weight: bold; cursor: pointer;
}

/* Slideshow */
#slideshow-container {
  position: absolute; inset: 0;
  z-index: 42;
  display: none; opacity: 0;
  transition: opacity 1s ease;
  overflow: hidden;
  flex-direction: column; align-items: center; justify-content: center;
}
#slideshow-container.visivel { display: flex; opacity: 1; }

.slideshow-bg {
  position: absolute; inset: -15px;
  background: url('./pagina.png?v=3') center/cover no-repeat;
  filter: blur(5px) brightness(0.55);
  transform: scale(1.06);
  z-index: 1;
}
.slideshow-title {
  font-family: 'Great Vibes', cursive;
  color: #f7d58b;
  font-size: clamp(28px, 7vw, 36px);
  text-shadow: 0 0 12px rgba(212, 175, 55, 0.75), 0 2px 6px rgba(0, 0, 0, 0.9);
  margin-bottom: 14px;
  z-index: 3; text-align: center; padding: 0 15px;
}
.photo-frame {
  position: relative;
  width: 82%; height: 64%;
  border-radius: 24px;
  border: 3.5px solid #d4af37;
  box-shadow: 0 0 35px rgba(212, 175, 55, 0.6), 0 15px 40px rgba(0, 0, 0, 0.95);
  overflow: hidden;
  background: #140308;
  z-index: 3;
}
.slide-photo {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0; transform: scale(1.02);
  transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), transform 5s cubic-bezier(0.25, 1, 0.5, 1);
}
.slide-photo.ativo { opacity: 1; transform: scale(1.12); }

.photo-smoke-pulse {
  position: absolute; inset: -15%;
  background: radial-gradient(circle, rgba(255, 248, 230, 0.88) 0%, rgba(255, 195, 215, 0.65) 45%, transparent 75%);
  filter: blur(22px);
  opacity: 0; pointer-events: none;
  z-index: 5; transition: opacity 0.6s ease-in-out;
}
.photo-smoke-pulse.ativo { opacity: 1; }

.slide-dots { display: flex; gap: 7px; margin-top: 14px; z-index: 3; }
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.35); border: 1px solid #d4af37;
  transition: all 0.5s ease;
}
.dot.ativo { background: #ffd700; transform: scale(1.4); box-shadow: 0 0 10px #ffd700; }

/* Convite Principal */
#convite-page { z-index: 10; display: none; opacity: 0; transition: opacity 0.8s ease; }
#convite-page.show { display: block; opacity: 1; }

/* 🌟 PLACA REAL CENTRAL DINÂMICA (SUBSTITUI OS DADOS PARA QUALQUER CLIENTE) 🌟 */
.overlay-dinamica {
  position: absolute;
  top: 27%; left: 16%;
  width: 68%; height: 43%;
  background: #fdf5ea;
  border-radius: 25px;
  z-index: 15;
  display: flex; /* Sempre visível para adaptar o convite */
  flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  box-shadow: inset 0 0 15px rgba(212, 175, 55, 0.35);
  border: 1px solid rgba(212, 175, 55, 0.4);
  padding: 8px 12px;
}
.overlay-dinamica h1 {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(34px, 8vw, 44px);
  color: #7b1328; margin: 0; line-height: 1;
}
.overlay-dinamica .idade {
  font-family: 'Cinzel', serif; font-size: 13px; font-weight: 700;
  color: #9b6c28; letter-spacing: 2px; margin-top: 2px; margin-bottom: 10px;
}
.info-badge {
  background: rgba(255, 255, 255, 0.88);
  border: 1px solid #e2c88d;
  border-radius: 20px;
  padding: 5px 12px; width: 94%;
  margin-bottom: 5px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Montserrat', sans-serif;
  font-size: 11.5px; font-weight: 700; color: #6a1727;
}

#smoke-overlay {
  position: absolute; inset: -10%;
  z-index: 44; pointer-events: none; opacity: 0;
  background: radial-gradient(circle, rgba(255, 248, 220, 0.95) 0%, rgba(255, 192, 203, 0.75) 45%, rgba(138, 30, 50, 0.4) 75%, transparent 100%);
  filter: blur(25px); transform: scale(0.7);
  transition: opacity 0.6s ease, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
}
#smoke-overlay.animar { opacity: 1; transform: scale(1.3); }

/* Borboletas */
#butterflies-group { position: absolute; inset: 0; pointer-events: none; z-index: 75; }
.magic-butterfly {
  position: absolute; top: 0; left: 0; pointer-events: none;
  transform-origin: center center;
  filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.9));
  display: block; will-change: transform;
}
.butterfly-body { width: 100%; height: 100%; position: relative; perspective: 600px; }
.butterfly-torso {
  position: absolute; top: 25%; left: 47%; width: 6%; height: 45%;
  background: #5c0f1e; border-radius: 10px; z-index: 3;
}
.wing {
  position: absolute; top: 15%; width: 48%; height: 68%;
  border: 1.5px solid #ffe066; transform-origin: right center;
}
.wing.left { left: 0; border-radius: 80% 30% 70% 20%; animation: flapLeft 0.25s infinite alternate ease-in-out; }
.wing.right { left: 52%; border-radius: 30% 80% 20% 70%; transform-origin: left center; animation: flapRight 0.25s infinite alternate ease-in-out; }

#b1 .wing { background: radial-gradient(circle at 75% 25%, #fff9e6 0%, #ff9ebb 50%, #8a1329 100%); }
#b2 .wing { background: radial-gradient(circle at 75% 25%, #ffffff 0%, #ffe082 50%, #b37400 100%); }
#b3 .wing { background: radial-gradient(circle at 75% 25%, #fff5f8 0%, #f48fb1 50%, #6a0b22 100%); }

@keyframes flapLeft { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(70deg); } }
@keyframes flapRight { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(-70deg); } }

#presentes-page { z-index: 25; display: none; opacity: 0; transition: opacity 0.4s ease; }
#presentes-page.show { display: block; opacity: 1; }

.tap-hint {
  position: absolute; top: 61.5%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 60; color: #fff;
  background: linear-gradient(135deg, rgba(138, 30, 50, 0.95) 0%, rgba(186, 45, 72, 0.95) 100%);
  border: 1.5px solid #ffd700;
  padding: 10px 24px; border-radius: 30px;
  font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase; white-space: nowrap;
  pointer-events: none;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6), 0 0 15px rgba(212, 175, 55, 0.4);
  animation: pulse 1.8s infinite ease-in-out;
}
.opened .tap-hint { display: none !important; }
@keyframes pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.05); } }

.btn-layer { position: absolute; inset: 0; z-index: 35; display: none; }
.btn-layer.show { display: block; }
.btn-click { position: absolute; display: block; background: transparent; cursor: pointer; }

#btn-local { left: 9%; top: 73.5%; width: 25%; height: 15%; border-radius: 50%; }
#btn-presente { left: 37.5%; top: 73.5%; width: 25%; height: 15%; border-radius: 50%; }
#btn-presenca { left: 65.5%; top: 73.5%; width: 25%; height: 15%; border-radius: 50%; }

#btn-pedagogicos { left: 19%; top: 46%; width: 19%; height: 16%; border-radius: 50%; }
#btn-livros       { left: 40.5%; top: 46%; width: 19%; height: 16%; border-radius: 50%; }
#btn-roupas       { left: 62%; top: 46%; width: 19%; height: 16%; border-radius: 50%; }
#btn-higiene     { left: 19%; top: 63%; width: 19%; height: 16%; border-radius: 50%; }
#btn-educativos  { left: 40.5%; top: 63%; width: 19%; height: 16%; border-radius: 50%; }
#btn-valepix     { left: 62%; top: 63%; width: 19%; height: 16%; border-radius: 50%; }

#btn-voltar { left: 33%; top: 83.5%; width: 34%; height: 7%; border-radius: 25px; }
#sparkle-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 70; pointer-events: none; }

/* Modal Pix */
#modal-pix {
  position: absolute; inset: 0; background: rgba(0, 0, 0, 0.82);
  backdrop-filter: blur(5px); z-index: 100;
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.modal-box {
  background: #fff8f0; border: 2px solid #d4af37; border-radius: 20px;
  padding: 24px 20px; text-align: center; width: 90%; max-width: 340px;
}
.modal-box h3 { color: #8a1e32; font-size: 19px; margin-bottom: 8px; }
.modal-box p { color: #555; font-size: 13px; margin-bottom: 12px; }
.pix-chave-container {
  background: #f0e6d6; padding: 10px; border-radius: 10px;
  font-family: monospace; font-size: 14px; font-weight: bold;
  color: #7b1328; word-break: break-all; margin-bottom: 8px; border: 1px dashed #c09d3b;
}
.pix-info-extra {
  font-size: 12px; color: #666; margin-bottom: 15px;
  background: rgba(212, 175, 55, 0.12); padding: 8px; border-radius: 8px;
}
.btn-copiar {
  background: #8a1e32; color: #fff; border: none; padding: 12px 22px;
  border-radius: 25px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px;
}
.btn-fechar { background: transparent; color: #777; border: none; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <img id="cover" src="./capa.png" alt="Capa" onclick="iniciarExperiencia()">
  <div class="tap-hint" onclick="iniciarExperiencia()">✨ TOQUE PARA ABRIR ✨</div>

  <!-- Borboletas -->
  <div id="butterflies-group">
    <div id="b1" class="magic-butterfly" style="width: 50px; height: 50px;">
      <div class="butterfly-body"><div class="wing left"></div><div class="butterfly-torso"></div><div class="wing right"></div></div>
    </div>
    <div id="b2" class="magic-butterfly" style="width: 42px; height: 42px;">
      <div class="butterfly-body"><div class="wing left" style="animation-duration: 0.23s;"></div><div class="butterfly-torso"></div><div class="wing right" style="animation-duration: 0.23s;"></div></div>
    </div>
    <div id="b3" class="magic-butterfly" style="width: 36px; height: 36px;">
      <div class="butterfly-body"><div class="wing left" style="animation-duration: 0.28s;"></div><div class="butterfly-torso"></div><div class="wing right" style="animation-duration: 0.28s;"></div></div>
    </div>
  </div>

  <video id="video-abertura" class="video-player" playsinline webkit-playsinline x5-playsinline preload="auto" src="https://i.imgur.com/JPzoItH.mp4"></video>

  <!-- Slideshow Dinâmico do Cliente -->
  <div id="slideshow-container">
    <div class="slideshow-bg"></div>
    <div class="slideshow-title" id="slide-title">1 Aninho de Puro Amor ✨</div>
    <div class="photo-frame" id="photoFrame">
      <div class="photo-smoke-pulse" id="photoSmoke"></div>
    </div>
    <div class="slide-dots" id="slideDots"></div>
  </div>

  <video id="video-fala" class="video-player" playsinline webkit-playsinline x5-playsinline preload="auto" src="https://i.imgur.com/3W1InHI.mp4"></video>
  <div id="smoke-overlay"></div>

  <button id="btn-pular" type="button" onclick="irParaFinal()">Pular vídeo ✕</button>
  <canvas id="sparkle-canvas"></canvas>

  <!-- Fundo do Convite -->
  <img id="convite-page" src="./pagina.png?v=3" alt="Convite Principal">

  <!-- 🌟 PLACA DE DADOS DO CLIENTE (SEMPRE ADAPTÁVEL) 🌟 -->
  <div class="overlay-dinamica" id="overlayDinamica">
    <h1 id="dyn-nome">Princesa</h1>
    <div class="idade" id="dyn-idade">👑 1 ANINHO 👑</div>
    <div class="info-badge" id="dyn-data">📅 Data Especial</div>
    <div class="info-badge" id="dyn-hora">⏰ 18:00 horas</div>
    <div class="info-badge" id="dyn-local" style="font-size: 11px;">📍 Salão Real de Festas</div>
  </div>

  <div class="btn-layer" id="btnLayerPrincipal">
    <a id="btn-local" class="btn-click" href="javascript:void(0)" onclick="abrirLocalizacao(event)"></a>
    <a id="btn-presente" class="btn-click" href="javascript:void(0)" onclick="animarBrilho(event); abrirPaginaPresentes()"></a>
    <a id="btn-presenca" class="btn-click" href="javascript:void(0)" onclick="confirmarPresencaWhatsapp(event)"></a>
  </div>

  <!-- Presentes -->
  <img id="presentes-page" src="https://i.postimg.cc/zX3NpXj6/presentes.png" alt="Presentes">

  <div class="btn-layer" id="btnLayerPresentes">
    <a id="btn-pedagogicos" class="btn-click" href="https://www.amazon.com.br/s?k=brinquedos+pedagogicos+1+ano" target="_blank" rel="noopener noreferrer" onclick="animarBrilho(event)"></a>
    <a id="btn-livros" class="btn-click" href="https://www.amazon.com.br/s?k=livros+infantis+bebe+1+ano" target="_blank" rel="noopener noreferrer" onclick="animarBrilho(event)"></a>
    <a id="btn-roupas" class="btn-click" href="https://www.lojasrenner.com.br/c/infantil/bebe" target="_blank" rel="noopener noreferrer" onclick="animarBrilho(event)"></a>
    <a id="btn-higiene" class="btn-click" href="https://www.granado.com.br/bebe" target="_blank" rel="noopener noreferrer" onclick="animarBrilho(event)"></a>
    <a id="btn-educativos" class="btn-click" href="https://www.rihappy.com.br/brinquedos-para-bebes" target="_blank" rel="noopener noreferrer" onclick="animarBrilho(event)"></a>
    <a id="btn-valepix" class="btn-click" href="javascript:void(0)" onclick="animarBrilho(event); abrirModalPix()"></a>
    <a id="btn-voltar" class="btn-click" href="javascript:void(0)" onclick="animarBrilho(event); voltarAoConvite()"></a>
  </div>

  <div id="modal-pix" onclick="fecharModalPix(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3 id="pix-title">🎁 Vale Presente</h3>
      <p>Caso prefira nos agraciar com um mimo via Pix:</p>
      <div class="pix-chave-container" id="texto-chave-pix">CHAVE-PIX-AQUI</div>
      <div class="pix-info-extra" id="pix-detalhes">
        <strong>Favorecido:</strong> Nome do Titular<br>
        <strong>Instituição:</strong> Banco
      </div>
      <button class="btn-copiar" type="button" onclick="copiarChavePix()">Copiar Chave Pix ✨</button>
      <button class="btn-fechar" type="button" onclick="fecharModalPix()">Fechar</button>
    </div>
  </div>

</div>

<audio id="musica" src="https://i.imgur.com/Qv9rKqF.mp4" loop preload="auto"></audio>
<audio id="audio-narracao" preload="auto"></audio>

<script>
// ==========================================
// 🌟 MOTOR UNIVERSAL: LÊ OS DADOS DO CLIENTE 🌟
// ==========================================
const params = new URLSearchParams(window.location.search);

// Esqueleto Neutro (Template)
let config = {
  nome: params.get('n') || "Princesa",
  idade: params.get('i') || "1 aninho",
  data: params.get('d') || "Data da Festa",
  hora: params.get('h') || "17:00 horas",
  local: params.get('l') || "Salão de Festas",
  maps: params.get('m') || "https://maps.google.com",
  whatsapp: params.get('w') || "5521999999999",
  pix: params.get('p') || "suachavepixaqui",
  pix_nome: params.get('pn') || "Titular do Pix",
  pix_banco: params.get('pb') || "Banco",
  audio: params.get('audio') || "https://files.catbox.moe/txl3r7.mp3",
  fotos: params.get('fotos') ? params.get('fotos').split(',') : [
    "https://i.postimg.cc/nzpLRbSH/Whats-App-Image-2026-10-16-at-20-04-49.jpg",
    "https://i.postimg.cc/7Lg6nYVL/Whats-App-Image-2026-10-16-at-20-04-50.jpg",
    "https://i.postimg.cc/bYCmhQXW/Whats-App-Image-2026-10-20-at-x.jpg"
  ]
};

// 1. Aplica o Nome e Dados na Placa Real
document.getElementById('page-title').innerText = "Convite Real - " + config.nome;
document.getElementById('dyn-nome').innerText = config.nome;
document.getElementById('dyn-idade').innerText = "👑 " + config.idade.toUpperCase() + " 👑";
document.getElementById('dyn-data').innerText = "📅 " + config.data;
document.getElementById('dyn-hora').innerText = "⏰ " + config.hora;
document.getElementById('dyn-local').innerText = "📍 " + config.local;
document.getElementById('slide-title').innerText = config.idade.toUpperCase() + " DE PURO AMOR ✨";

// 2. Aplica o Pix
document.getElementById('pix-title').innerText = "🎁 Vale Presente - " + config.nome;
document.getElementById('texto-chave-pix').innerText = config.pix;
document.getElementById('pix-detalhes').innerHTML = "<strong>Favorecido:</strong> " + config.pix_nome + "<br><strong>Instituição:</strong> " + config.pix_banco;

// 3. Monta o Álbum de Fotos Dinâmico do Cliente
const photoFrame = document.getElementById('photoFrame');
const slideDotsContainer = document.getElementById('slideDots');
config.fotos.forEach((link, idx) => {
  const img = document.createElement('img');
  img.src = link;
  img.className = 'slide-photo';
  if (idx === 0) img.classList.add('ativo');
  photoFrame.appendChild(img);

  const dot = document.createElement('span');
  dot.className = 'dot';
  if (idx === 0) dot.classList.add('ativo');
  slideDotsContainer.appendChild(dot);
});

// Elementos
const stage = document.getElementById('stage');
const videoAbertura = document.getElementById('video-abertura');
const videoFala = document.getElementById('video-fala');
const btnPular = document.getElementById('btn-pular');
const convitePage = document.getElementById('convite-page');
const overlayDinamica = document.getElementById('overlayDinamica');
const presentesPage = document.getElementById('presentes-page');
const btnLayerPrincipal = document.getElementById('btnLayerPrincipal');
const btnLayerPresentes = document.getElementById('btnLayerPresentes');
const musica = document.getElementById('musica');
const audioNarracao = document.getElementById('audio-narracao');
const modalPix = document.getElementById('modal-pix');
const smokeOverlay = document.getElementById('smoke-overlay');
const b1 = document.getElementById('b1');
const b2 = document.getElementById('b2');
const b3 = document.getElementById('b3');
const butterfliesGroup = document.getElementById('butterflies-group');
const slideshowContainer = document.getElementById('slideshow-container');
const photoSmoke = document.getElementById('photoSmoke');

let slideAtual = 0;
let slideInterval = null;
let photoChangeTimeout = null;
let smokeTimeout = null;
let falaIniciada = false;

// Configura o áudio
audioNarracao.src = config.audio;
audioNarracao.load();

// Canvas Partículas
const canvas = document.getElementById('sparkle-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let butterflySparkles = [];

function ajustarCanvas() {
  canvas.width = stage.clientWidth;
  canvas.height = stage.clientHeight;
}
window.addEventListener('resize', ajustarCanvas);
ajustarCanvas();

// Funções dos Botões
function abrirLocalizacao(e) {
  if (e) animarBrilho(e);
  window.open(config.maps, '_blank');
}

function confirmarPresencaWhatsapp(e) {
  if (e) animarBrilho(e);
  const castelo = String.fromCodePoint(0x1F3F0);
  const coroa = String.fromCodePoint(0x1F451);
  const festa = String.fromCodePoint(0x1F389);
  const brilho = String.fromCodePoint(0x2728);

  const mensagem = "Saudações Reais! " + castelo + coroa + " Atendendo à nobre convocação de " + config.nome + ", confirmo com imensa honra e alegria a nossa presença no Grande Baile de " + config.idade + "! Nos vemos dia " + config.data + " às " + config.hora + " no " + config.local + "! " + festa + brilho;

  const url = "https://api.whatsapp.com/send?phone=" + config.whatsapp + "&text=" + encodeURIComponent(mensagem);
  window.open(url, '_blank');
}

// Rastro de Brilho
function soltarBrilhoRastro(x, y) {
  const cores = ['#ffd700', '#fff8dc', '#ffb6c1', '#ffffff', '#ffe29f'];
  for (let i = 0; i < 3; i++) {
    particles.push({
      x: x + (Math.random() * 12 - 6),
      y: y + (Math.random() * 12 - 6),
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2 + 0.5,
      radius: Math.random() * 3 + 1,
      alpha: 1, decay: 0.02,
      color: cores[Math.floor(Math.random() * cores.length)]
    });
  }
}
stage.addEventListener('mousemove', (e) => {
  const rect = stage.getBoundingClientRect();
  soltarBrilhoRastro(e.clientX - rect.left, e.clientY - rect.top);
});
stage.addEventListener('touchmove', (e) => {
  if (e.touches && e.touches[0]) {
    const rect = stage.getBoundingClientRect();
    soltarBrilhoRastro(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
  }
}, { passive: true });

// Borboletas 3D
let borboletasAtivas = true;
let tVoo = 0;
function ativarBorboletas(sim) {
  borboletasAtivas = sim;
  butterfliesGroup.style.display = sim ? 'block' : 'none';
}

function atualizarBorboletas() {
  if (!borboletasAtivas) return;
  tVoo += 0.022;
  const w = stage.clientWidth || 360;
  const h = stage.clientHeight || 640;

  const b1X = (w * 0.48) + Math.sin(tVoo * 0.85) * (w * 0.36) + Math.cos(tVoo * 1.6) * 20;
  const b1Y = (h * 0.35) + Math.cos(tVoo * 0.7) * (h * 0.18) + Math.sin(tVoo * 1.4) * 28;
  b1.style.transform = `translate(${b1X - 25}px, ${b1Y - 25}px) rotate(90deg)`;

  const b2X = (w * 0.52) + Math.cos(tVoo * 0.95 + 1.2) * (w * 0.34);
  const b2Y = (h * 0.45) + Math.sin(tVoo * 0.8 + 1.2) * (h * 0.22);
  b2.style.transform = `translate(${b2X - 21}px, ${b2Y - 21}px) rotate(90deg)`;

  const b3X = (w * 0.5) + Math.sin(tVoo * 1.1 + 2.5) * (w * 0.28);
  const b3Y = (h * 0.28) + Math.cos(tVoo * 0.9 + 2.5) * (h * 0.15);
  b3.style.transform = `translate(${b3X - 18}px, ${b3Y - 18}px) rotate(90deg)`;

  if (Math.random() < 0.75) {
    const alvos = [ {x: b1X, y: b1Y}, {x: b2X, y: b2Y}, {x: b3X, y: b3Y} ];
    const p = alvos[Math.floor(Math.random() * alvos.length)];
    butterflySparkles.push({
      x: p.x, y: p.y,
      vx: (Math.random() - 0.5) * 1.2, vy: Math.random() * 1.5 + 0.4,
      radius: Math.random() * 2.8 + 1.2, alpha: 1, decay: 0.02,
      color: '#ffd700'
    });
  }
}

function loopAnimacao() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  atualizarBorboletas();

  for (let i = butterflySparkles.length - 1; i >= 0; i--) {
    const p = butterflySparkles[i];
    p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
    if (p.alpha > 0) {
      ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    } else butterflySparkles.splice(i, 1);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
    if (p.alpha > 0) {
      ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    } else particles.splice(i, 1);
  }
  requestAnimationFrame(loopAnimacao);
}
requestAnimationFrame(loopAnimacao);

function animarBrilho(e) {
  ajustarCanvas();
  const rect = stage.getBoundingClientRect();
  const x = (e.clientX || (rect.left + rect.width / 2)) - rect.left;
  const y = (e.clientY || (rect.top + rect.height * 0.8)) - rect.top;
  for (let i = 0; i < 30; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
      radius: Math.random() * 3.5 + 1.5, alpha: 1, decay: 0.02,
      color: '#ffd700'
    });
  }
}

// Fluxo do Convite
let jaIniciou = false;
let transicaoIniciada = false;

function iniciarExperiencia() {
  if (jaIniciou) return;
  jaIniciou = true;

  if (audioNarracao) { audioNarracao.play().then(() => { audioNarracao.pause(); audioNarracao.currentTime = 0; }).catch(() => {}); }
  if (musica) { musica.play().then(() => { musica.pause(); musica.currentTime = 0; }).catch(() => {}); }

  ativarBorboletas(false);
  stage.classList.add('opened');
  videoAbertura.classList.add('visivel');
  btnPular.style.display = 'block';

  videoAbertura.currentTime = 0;
  videoAbertura.play().catch(iniciarSlideshow);

  videoAbertura.addEventListener('timeupdate', () => {
    if (!transicaoIniciada && videoAbertura.duration && (videoAbertura.duration - videoAbertura.currentTime <= 0.65)) {
      transicaoIniciada = true;
      iniciarSlideshow();
    }
  });
  videoAbertura.onended = () => { if (!transicaoIniciada) iniciarSlideshow(); };
  videoAbertura.onerror = iniciarSlideshow;
}

function iniciarSlideshow() {
  transicaoIniciada = true;
  videoAbertura.classList.remove('visivel');
  setTimeout(() => { videoAbertura.pause(); }, 500);

  if (musica) { musica.volume = 0.58; musica.play().catch(() => {}); }
  if (audioNarracao && config.audio !== 'instrumental') {
    audioNarracao.currentTime = 0;
    audioNarracao.volume = 1;
    audioNarracao.play().catch(() => {});
  }

  slideshowContainer.classList.add('visivel');
  slideAtual = 0;
  mostrarSlide(slideAtual);
  ativarBorboletas(true);

  const fotosDinamicas = document.querySelectorAll('.slide-photo');
  let tempoPorFoto = Math.max(2400, (16 / fotosDinamicas.length) * 1000);

  slideInterval = setInterval(() => {
    photoSmoke.classList.add('ativo');
    photoChangeTimeout = setTimeout(() => {
      slideAtual++;
      if (slideAtual < fotosDinamicas.length) {
        mostrarSlide(slideAtual);
        smokeTimeout = setTimeout(() => { photoSmoke.classList.remove('ativo'); }, 350);
      } else {
        finalizarSlideshowEIrParaFala();
      }
    }, 550);
  }, tempoPorFoto);

  if (audioNarracao) {
    audioNarracao.onended = () => { finalizarSlideshowEIrParaFala(); };
  }
}

function mostrarSlide(index) {
  const photos = document.querySelectorAll('.slide-photo');
  const dots = document.querySelectorAll('.dot');
  photos.forEach((img, i) => { img.classList.toggle('ativo', i === index); });
  dots.forEach((dot, i) => { dot.classList.toggle('ativo', i === index); });
}

function finalizarSlideshowEIrParaFala() {
  if (falaIniciada) return;
  falaIniciada = true;

  if (slideInterval) clearInterval(slideInterval);
  if (photoChangeTimeout) clearTimeout(photoChangeTimeout);
  if (smokeTimeout) clearTimeout(smokeTimeout);

  slideshowContainer.classList.remove('visivel');
  ativarBorboletas(false);

  if (musica) musica.volume = 0.22;

  videoFala.currentTime = 0;
  videoFala.muted = false;
  videoFala.classList.add('visivel');
  videoFala.play().catch(irParaFinal);

  videoFala.onended = irParaFinal;
  videoFala.onerror = irParaFinal;
}

function irParaFinal() {
  falaIniciada = true;
  if (slideInterval) clearInterval(slideInterval);
  if (photoChangeTimeout) clearTimeout(photoChangeTimeout);
  if (smokeTimeout) clearTimeout(smokeTimeout);
  if (audioNarracao) audioNarracao.pause();
  
  btnPular.style.display = 'none';
  smokeOverlay.classList.add('animar');

  setTimeout(() => {
    if (videoAbertura) { videoAbertura.classList.remove('visivel'); videoAbertura.pause(); }
    if (slideshowContainer) slideshowContainer.classList.remove('visivel');
    if (videoFala) { videoFala.classList.remove('visivel'); videoFala.pause(); }

    stage.classList.add('opened');
    if (musica) { musica.volume = 0.65; if (musica.paused) musica.play().catch(() => {}); }

    convitePage.classList.add('show');
    btnLayerPrincipal.classList.add('show');
    
    // Placa adaptada para qualquer cliente
    overlayDinamica.style.display = 'flex';

    ativarBorboletas(true);
    setTimeout(() => { smokeOverlay.classList.remove('animar'); }, 450);
  }, 350);
}

function abrirPaginaPresentes() {
  convitePage.classList.remove('show');
  overlayDinamica.style.display = 'none';
  btnLayerPrincipal.classList.remove('show');
  presentesPage.classList.add('show');
  btnLayerPresentes.classList.add('show');
  ativarBorboletas(true);
}

function voltarAoConvite() {
  presentesPage.classList.remove('show');
  btnLayerPresentes.classList.remove('show');
  convitePage.classList.add('show');
  overlayDinamica.style.display = 'flex';
  btnLayerPrincipal.classList.add('show');
  ativarBorboletas(true);
}

function abrirModalPix() { modalPix.style.display = 'flex'; }
function fecharModalPix() { modalPix.style.display = 'none'; }
function copiarChavePix() {
  navigator.clipboard.writeText(config.pix).then(() => {
    alert("✨ Chave Pix copiada com sucesso!\n\nFavorecido: " + config.pix_nome + "\nInstituição: " + config.pix_banco);
    fecharModalPix();
  }).catch(() => { prompt("Copie a chave Pix:", config.pix); });
}
